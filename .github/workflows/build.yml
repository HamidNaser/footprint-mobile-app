name: Mobile App Build

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

env:
  NODE_VERSION: '20'

jobs:
  # Lint and test before building
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

  # Build with EAS
  build:
    name: Build with EAS
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Only run on main branch pushes or manual trigger
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Determine build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "platform=${{ github.event.inputs.platform }}" >> $GITHUB_OUTPUT
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          else
            echo "platform=all" >> $GITHUB_OUTPUT
            echo "profile=preview" >> $GITHUB_OUTPUT
          fi

      - name: Build iOS
        if: steps.params.outputs.platform == 'all' || steps.params.outputs.platform == 'ios'
        run: eas build --platform ios --profile ${{ steps.params.outputs.profile }} --non-interactive

      - name: Build Android
        if: steps.params.outputs.platform == 'all' || steps.params.outputs.platform == 'android'
        run: eas build --platform android --profile ${{ steps.params.outputs.profile }} --non-interactive

      - name: Build summary
        run: |
          echo "## Build Complete! 📱" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ steps.params.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ steps.params.outputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View builds at: https://expo.dev/accounts/YOUR_EXPO_USERNAME/projects/footprint-mobile-app/builds" >> $GITHUB_STEP_SUMMARY

  # Submit to stores (only for production builds, manual trigger)
  submit:
    name: Submit to Stores
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Submit to App Store
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Submit to Google Play
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
        run: eas submit --platform android --latest --non-interactive

      - name: Submission summary
        run: |
          echo "## Submitted to Stores! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Apps have been submitted for review." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: Check App Store Connect for review status" >> $GITHUB_STEP_SUMMARY
          echo "- Android: Check Google Play Console for review status" >> $GITHUB_STEP_SUMMARY
