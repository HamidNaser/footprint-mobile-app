name: Release

# Identifies the run in the Actions list without having to open it, e.g.
# "production ios from main -> TestFlight" vs "preview ios from fix/x (no upload)".
run-name: >-
  ${{ inputs.profile }} ${{ inputs.platform }} from ${{ github.ref_name }}
  ${{ inputs.profile == 'production' && inputs.submit && '-> TestFlight' || '(no upload)' }}

# The release button. Manual only -- shipping is a decision, not a side effect
# of merging. Actions tab -> Release -> Run workflow.
#
# A `production` build is the SAME binary that eventually reaches the App Store:
# it uploads to App Store Connect, lands in TestFlight, and is later promoted to
# store review without rebuilding. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: 'production = TestFlight/App Store. preview = internal ad-hoc testing.'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      submit:
        description: 'Upload to App Store Connect / Play after a successful build'
        required: true
        default: true
        type: boolean

env:
  # 22, not 20. eas-cli pulls @oclif/plugin-autocomplete, which declares
  # "node": ">=22.0.0" -- so on 20 the release failed while *installing the CLI*,
  # before it had seen a line of the app. Nothing in the build had gone wrong; the
  # toolchain simply could not be assembled. GitHub is also deprecating Node 20 on
  # its runners, so this was going to arrive on its own shortly.
  NODE_VERSION: '22'

concurrency:
  # Never let two releases race -- build numbers and store uploads are not
  # safely concurrent. Queue rather than cancel: a running release may already
  # have uploaded a binary.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    # Approval gate. Requires a GitHub Environment named "production" with
    # required reviewers configured -- see docs/RELEASING.md for setup.
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Written before the build so the run page identifies itself immediately,
      # rather than only once the 15-30 min build finishes.
      - name: What is building
        run: |
          if [ "${{ inputs.profile }}" = "production" ]; then
            if [ "${{ inputs.submit }}" = "true" ]; then
              LANDS="**TestFlight.** Same binary that is later promoted to App Store review."
            else
              LANDS="EAS artifact only — built but not uploaded to App Store Connect."
            fi
          else
            LANDS="**Ad-hoc internal install** via the expo.dev build link. Does *not* appear in TestFlight."
          fi
          {
            echo "## Building"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` — $(git log -1 --pretty=%s) |"
            echo "| Platform | \`${{ inputs.platform }}\` |"
            echo "| Profile | \`${{ inputs.profile }}\` |"
            echo "| Where it lands | $LANDS |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Guard against submitting a preview build
        if: ${{ inputs.submit && inputs.profile == 'preview' }}
        run: |
          echo "::error::The 'preview' profile is distribution:internal (ad-hoc) and cannot be submitted to a store. Re-run with profile=production, or with submit=false."
          exit 1

      - name: Build${{ inputs.submit && ' and submit' || '' }}
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            ${{ inputs.submit && '--auto-submit' || '' }}

      # The number that identifies this build in TestFlight. appVersionSource is
      # "remote", so EAS owns the counter and app.json cannot tell us it.
      # Reporting only -- never allowed to fail a release that already built.
      # Where the build actually landed.
      #
      # The summary used to say "install it from the build link below" and then link to the
      # *list* of every build ever made -- so finding the one that had just been produced
      # meant matching it by timestamp. An ad-hoc build is useless until it is on a phone,
      # and the link is the only way it gets there, so it belongs in the run that made it.
      #
      # Read back from build:list rather than parsed out of the build command's own output:
      # the build has just finished, so it is the most recent, and --json gives a shape that
      # will not shift with the CLI's console formatting.
      - name: Find the build
        id: builtat
        if: always()
        continue-on-error: true
        run: |
          JSON="$(eas build:list --limit 1 --json --non-interactive 2>/dev/null || echo '[]')"
          ID="$(node -p "try{JSON.parse(process.argv[1])[0].id||''}catch(e){''}" "$JSON")"
          IPA="$(node -p "try{JSON.parse(process.argv[1])[0].artifacts.buildUrl||''}catch(e){''}" "$JSON")"
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "ipa=$IPA" >> $GITHUB_OUTPUT

      - name: Read build number
        id: buildnum
        if: always()
        continue-on-error: true
        run: |
          read_one() {
            eas build:version:get --platform "$1" --non-interactive 2>/dev/null \
              | grep -oE '[0-9]+' | tail -1
          }
          if [ "${{ inputs.platform }}" = "all" ]; then
            LABEL="ios $(read_one ios) / android $(read_one android)"
          else
            LABEL="$(read_one ${{ inputs.platform }})"
          fi
          echo "label=${LABEL:-unknown}" >> $GITHUB_OUTPUT

      - name: Summary
        if: always()
        run: |
          BUILD="${{ steps.buildnum.outputs.label }}"
          VERSION="$(node -p "require('./app.json').expo.version" 2>/dev/null || echo '?')"
          {
            echo "## Result: ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            if [ "${{ job.status }}" = "success" ] && [ "${{ inputs.profile }}" = "production" ]; then
              echo "| Look for in TestFlight | **$VERSION (${BUILD:-unknown})** |"
            else
              echo "| Build number | \`${BUILD:-unknown}\` — nothing reached TestFlight |"
            fi
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Submitted | \`${{ inputs.submit }}\` |"
            echo "| Triggered by | @${{ github.actor }} |"
            echo ""
            PAGE=""
            if [ -n "${{ steps.builtat.outputs.id }}" ]; then
              PAGE="https://expo.dev/accounts/hamid.naser/projects/footprint-mobile-app/builds/${{ steps.builtat.outputs.id }}"
            fi
            if [ "${{ inputs.profile }}" = "preview" ]; then
              echo "> This is an **ad-hoc** build. It will **not** appear in TestFlight."
              echo ""
              if [ -n "$PAGE" ]; then
                echo "### Install it"
                echo ""
                echo "Open this **on the iPhone** and press Install:"
                echo ""
                echo "$PAGE"
                echo ""
                echo "Delete the existing FootPrint first — iOS will not replace an app"
                echo "signed a different way, and deleting takes the local database with it,"
                echo "so let sync finish before you do."
              else
                echo "> Could not read the build link; find it in the builds list below."
              fi
            elif [ -n "$PAGE" ]; then
              echo "- This build: $PAGE"
            fi
            echo ""
            echo "- Builds (build number ↔ commit): https://expo.dev/accounts/hamid.naser/projects/footprint-mobile-app/builds"
            echo "- TestFlight: https://appstoreconnect.apple.com/apps/6796826616/testflight/ios"
          } >> $GITHUB_STEP_SUMMARY
